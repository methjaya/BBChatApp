<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BB Chat</title>
  
  <!-- SVG Favicon with BB Logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23007AFF'/><text x='50' y='67' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='52' font-weight='900' fill='white' text-anchor='middle' letter-spacing='-2'>BB</text></svg>">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --primary: #007aff;
      --sent-bg: #007aff;
      --received-bg: #e5e5ea;
      --text-dark: #1c1c1e;
      --text-gray: #8e8e93;
      --border-color: #d1d1d6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    #app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: var(--card-bg); position: relative; overflow: hidden; }
    
    /* Screens */
    .screen { position: absolute; inset: 0; background: var(--card-bg); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    .hidden { display: none !important; }

    /* BB Logo Badge */
    .bb-logo-badge {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #007aff, #0051a8);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 24px;
      box-shadow: 0 12px 24px rgba(0, 122, 255, 0.28);
    }

    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: var(--text-dark); letter-spacing: -0.5px; }
    p { font-size: 15px; color: var(--text-gray); margin-bottom: 32px; line-height: 1.4; }

    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-google { background: #f2f2f7; color: #1c1c1e; border: 1px solid var(--border-color); }

    input[type="text"] { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); font-size: 16px; margin-bottom: 20px; outline: none; background: #f9f9f9; color: var(--text-dark); }
    input[type="text"]:focus { border-color: var(--primary); background: #ffffff; }

    /* Header */
    header { height: 64px; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-bb-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: white; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; letter-spacing: -1px; }
    .user-details { text-align: left; }
    .user-details .name { font-size: 16px; font-weight: 600; color: var(--text-dark); }
    .user-details .status { font-size: 12px; color: #34c759; font-weight: 500; }

    /* Chat Area */
    #chat-box { flex: 1; overflow-y: auto; padding: 76px 16px 76px 16px; display: flex; flex-direction: column; gap: 8px; background: #ffffff; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-break: break-word; animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .sent { align-self: flex-end; background: var(--sent-bg); color: white; border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: var(--received-bg); color: var(--text-dark); border-bottom-left-radius: 4px; }
    .msg img { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    .msg-author { font-size: 11px; opacity: 0.7; margin-bottom: 3px; font-weight: 600; }

    /* Input Footer */
    footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border-color); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
    .file-btn { color: var(--primary); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    #file-input { display: none; }
    #message-input { flex: 1; height: 38px; border-radius: 19px; border: 1px solid var(--border-color); padding: 0 16px; font-size: 15px; outline: none; background: #f2f2f7; margin-bottom: 0; }
    .send-btn { background: var(--primary); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Landing / Login Screen -->
    <div id="login-screen" class="screen">
      <div class="bb-logo-badge">BB</div>
      <h1>Welcome to BB Chat</h1>
      <p>Private end-to-end messaging platform.</p>
      <button id="google-login-btn" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.88 10.78c-.18-.53-.28-1.09-.28-1.78s.1-1.25.28-1.78L.97 4.96C.35 6.18 0 7.55 0 9s.35 2.82.97 4.04l2.91-2.26z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.91 2.26C4.6 5.05 6.62 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen" class="screen hidden">
      <div class="bb-logo-badge">BB</div>
      <h1>Create Profile</h1>
      <p>Set your display name to start chatting.</p>
      <input type="text" id="display-name-input" placeholder="Your Name" />
      <button id="save-profile-btn" class="btn btn-primary">Enter Room</button>
    </div>

    <!-- Chat Header -->
    <header>
      <div class="header-info">
        <div class="header-bb-icon">BB</div>
        <div class="user-details">
          <div id="header-name" class="name">Chat Room</div>
          <div class="status">Online</div>
        </div>
      </div>
      <button id="logout-btn" style="background:none; border:none; color:var(--primary); font-size:15px; font-weight: 500; cursor:pointer;">Exit</button>
    </header>

    <div id="chat-box"></div>

    <footer>
      <!-- Camera SVG Icon -->
      <label for="file-input" class="file-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </label>
      <input type="file" id="file-input" accept="image/*" />
      <input type="text" id="message-input" placeholder="Message" />
      <!-- Send Arrow SVG Icon -->
      <button id="send-btn" class="send-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref as dbRef, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCumpuLgLQim1FAiibLIQKHGyzNcGyLTcs",
      authDomain: "bbchat-app.firebaseapp.com",
      databaseURL: "https://bbchat-app-default-rtdb.firebaseio.com",
      projectId: "bbchat-app",
      storageBucket: "bbchat-app.firebasestorage.app",
      messagingSenderId: "798098467106",
      appId: "1:798098467106:web:368f89dee243b547d4dd7b",
      measurementId: "G-PNKYJQJT9V"
    };

    const IMGBB_API_KEY = "874affb0b9a32ab658bf8d4ba86d28bg";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let customDisplayName = "";

    const loginScreen = document.getElementById("login-screen");
    const profileScreen = document.getElementById("profile-screen");
    const displayNameInput = document.getElementById("display-name-input");
    const chatBox = document.getElementById("chat-box");
    const messageInput = document.getElementById("message-input");

    // Use Redirect to prevent WebKit popup errors on Mobile browsers
    document.getElementById("google-login-btn").addEventListener("click", () => {
      signInWithRedirect(auth, provider);
    });

    // Check redirect results on load
    getRedirectResult(auth).catch((err) => {
      if (err.code) alert("Authentication error: " + err.message);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginScreen.classList.add("hidden");
        const savedName = localStorage.getItem(`chat_name_${user.uid}`);
        if (savedName) {
          customDisplayName = savedName;
          showChat();
        } else {
          displayNameInput.value = user.displayName || "";
          profileScreen.classList.remove("hidden");
        }
      } else {
        currentUser = null;
        loginScreen.classList.remove("hidden");
        profileScreen.classList.add("hidden");
      }
    });

    document.getElementById("save-profile-btn").addEventListener("click", () => {
      const name = displayNameInput.value.trim();
      if (name) {
        customDisplayName = name;
        localStorage.setItem(`chat_name_${currentUser.uid}`, name);
        profileScreen.classList.add("hidden");
        showChat();
      }
    });

    function showChat() {
      document.getElementById("header-name").innerText = customDisplayName;
    }

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== "" && currentUser) {
        push(dbRef(db, "messages"), { 
          uid: currentUser.uid, 
          sender: customDisplayName, 
          text: text, 
          image: null,
          timestamp: Date.now()
        });
        messageInput.value = "";
      }
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          push(dbRef(db, "messages"), {
            uid: currentUser.uid,
            sender: customDisplayName,
            text: "",
            image: data.data.url,
            timestamp: Date.now()
          });
        } else {
          alert("Image upload failed.");
        }
      } catch (error) {
        alert("Error uploading image: " + error.message);
      }

      e.target.value = "";
    });

    onChildAdded(dbRef(db, "messages"), (snapshot) => {
      const data = snapshot.val();
      const isMe = currentUser && data.uid === currentUser.uid;
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${isMe ? "sent" : "received"}`;
      
      let content = `<div class="msg-author">${data.sender}</div>`;
      if (data.text) content += `<div>${data.text}</div>`;
      if (data.image) content += `<img src="${data.image}" alt="shared photo" />`;
      
      msgDiv.innerHTML = content;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
