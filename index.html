<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BB Chat</title>
  
  <!-- SVG Favicon with BB Logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23007AFF'/><text x='50' y='67' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='52' font-weight='900' fill='white' text-anchor='middle' letter-spacing='-2'>BB</text></svg>">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --primary: #007aff;
      --sent-bg: #007aff;
      --received-bg: #e5e5ea;
      --text-dark: #000000;
      --text-gray: #8e8e93;
      --border-color: #d1d1d6;
      --danger: #ff3b30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #1c1c1e; display: flex; justify-content: center; align-items: center; }
    
    #app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--card-bg); position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.3); }
    
    /* Screens */
    .screen { position: absolute; inset: 0; background: var(--card-bg); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    .hidden { display: none !important; }

    /* BB Logo Badge */
    .bb-logo-badge {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #007aff, #0051a8);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(0, 122, 255, 0.25);
    }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); letter-spacing: -0.5px; }
    p { font-size: 14px; color: var(--text-gray); margin-bottom: 24px; line-height: 1.4; }

    .auth-toggle { display: flex; background: #e5e5ea; border-radius: 10px; padding: 3px; width: 100%; margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-gray); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .auth-tab.active { background: white; color: var(--text-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

    .input-group { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 16px; outline: none; background: #f9f9f9; color: var(--text-dark); appearance: none; }
    input:focus { border-color: var(--primary); background: #ffffff; }

    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--primary); color: white; }

    /* Chat Header */
    header { height: 60px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-bb-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: white; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; letter-spacing: -1px; }
    .user-details { text-align: left; }
    .user-details .name { font-size: 16px; font-weight: 600; color: var(--text-dark); line-height: 1.2; }
    .user-details .status { font-size: 12px; color: var(--text-gray); font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; display: inline-block; }
    .status-dot.online { background: #34c759; }

    /* Chat Area */
    #chat-box { flex: 1; overflow-y: auto; padding: 72px 14px 72px 14px; display: flex; flex-direction: column; gap: 8px; background: #ffffff; -webkit-overflow-scrolling: touch; }
    
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-break: break-word; position: relative; animation: fadeIn 0.15s ease-out; cursor: pointer; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .sent { align-self: flex-end; background: var(--sent-bg); color: white; border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: var(--received-bg); color: var(--text-dark); border-bottom-left-radius: 4px; }
    .msg img { max-width: 100%; max-height: 240px; border-radius: 12px; margin-top: 4px; display: block; object-fit: cover; }
    .msg-author { font-size: 11px; opacity: 0.7; margin-bottom: 2px; font-weight: 600; }
    .msg-time { font-size: 10px; opacity: 0.65; margin-top: 3px; text-align: right; }

    /* Input Footer */
    footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border-color); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; z-index: 10; }
    .file-btn { color: var(--primary); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    #file-input { display: none; }
    #message-input { flex: 1; height: 38px; border-radius: 19px; border: 1px solid var(--border-color); padding: 0 14px; font-size: 15px; outline: none; background: #f2f2f7; color: var(--text-dark); margin-bottom: 0; }
    .send-btn { background: var(--primary); color: white; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:disabled { opacity: 0.4; }

    /* Fullscreen Image Preview Modal */
    #image-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #image-modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; object-fit: contain; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="bb-logo-badge">BB</div>
      <h1>BB Chat</h1>
      <p id="auth-desc">Sign in with your Mobile Phone & PIN.</p>

      <div class="auth-toggle">
        <button id="tab-login" class="auth-tab active">Log In</button>
        <button id="tab-register" class="auth-tab">Create Account</button>
      </div>

      <div class="input-group">
        <input type="tel" id="auth-phone" placeholder="Mobile Phone Number" autocomplete="tel" />
        <input type="text" id="auth-name" class="hidden" placeholder="Your Display Name" autocomplete="name" />
        <input type="password" id="auth-pin" maxlength="6" pattern="\d*" placeholder="4-Digit PIN" />
      </div>

      <button id="auth-btn" class="btn btn-primary">Log In</button>
    </div>

    <!-- Chat Header -->
    <header>
      <div class="header-info">
        <div class="header-bb-icon">BB</div>
        <div class="user-details">
          <div id="header-name" class="name">Chat Room</div>
          <div class="status">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Connecting...</span>
          </div>
        </div>
      </div>
      <button id="logout-btn" style="background:none; border:none; color:var(--primary); font-size:15px; font-weight: 500; cursor:pointer;">Exit</button>
    </header>

    <div id="chat-box"></div>

    <footer>
      <label for="file-input" class="file-btn" id="file-label">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </label>
      <input type="file" id="file-input" accept="image/*" />
      <input type="text" id="message-input" placeholder="Message" autocomplete="off" />
      <button id="send-btn" class="send-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </footer>
  </div>

  <!-- Fullscreen Image Viewer Modal -->
  <div id="image-modal" class="hidden">
    <img id="modal-img" src="" alt="Full view" />
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push, onChildAdded, onChildRemoved, get, child, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCumpuLgLQim1FAiibLIQKHGyzNcGyLTcs",
      authDomain: "bbchat-app.firebaseapp.com",
      databaseURL: "https://bbchat-app-default-rtdb.firebaseio.com",
      projectId: "bbchat-app",
      storageBucket: "bbchat-app.firebasestorage.app",
      messagingSenderId: "798098467106",
      appId: "1:798098467106:web:368f89dee243b547d4dd7b",
      measurementId: "G-PNKYJQJT9V"
    };

    const IMGBB_API_KEY = "874affb0b9a32ab658bf8d4ba86d28bg";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let isRegisterMode = false;

    // DOM Elements
    const authScreen = document.getElementById("auth-screen");
    const authPhone = document.getElementById("auth-phone");
    const authName = document.getElementById("auth-name");
    const authPin = document.getElementById("auth-pin");
    const authBtn = document.getElementById("auth-btn");
    const authDesc = document.getElementById("auth-desc");
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const chatBox = document.getElementById("chat-box");
    const messageInput = document.getElementById("message-input");
    const fileInput = document.getElementById("file-input");
    const imageModal = document.getElementById("image-modal");
    const modalImg = document.getElementById("modal-img");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    // Toggle Tabs
    tabLogin.addEventListener("click", () => {
      isRegisterMode = false;
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      authName.classList.add("hidden");
      authDesc.innerText = "Sign in with your Mobile Phone & PIN.";
      authBtn.innerText = "Log In";
    });

    tabRegister.addEventListener("click", () => {
      isRegisterMode = true;
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      authName.classList.remove("hidden");
      authDesc.innerText = "Set up your Phone, Display Name & PIN.";
      authBtn.innerText = "Create Account";
    });

    function cleanPhone(phone) {
      return phone.replace(/[^0-9]/g, "");
    }

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Auto Login
    const savedSession = localStorage.getItem("bbchat_user_session");
    if (savedSession) {
      try {
        currentUser = JSON.parse(savedSession);
        authScreen.classList.add("hidden");
        document.getElementById("header-name").innerText = currentUser.name;
        listenForMessages();
        setupOnlineStatus();
      } catch (e) {
        localStorage.removeItem("bbchat_user_session");
      }
    }

    // Authenticate Action
    authBtn.addEventListener("click", async () => {
      const rawPhone = authPhone.value.trim();
      const phoneKey = cleanPhone(rawPhone);
      const pin = authPin.value.trim();

      if (!phoneKey || phoneKey.length < 7) {
        alert("Enter a valid mobile phone number.");
        return;
      }
      if (!pin || pin.length < 4) {
        alert("Enter a valid PIN (minimum 4 digits).");
        return;
      }

      const userRef = dbRef(db, `users/${phoneKey}`);
      const dbSnap = await get(userRef);

      if (isRegisterMode) {
        const name = authName.value.trim();
        if (!name) { alert("Enter your display name."); return; }
        if (dbSnap.exists()) { alert("Account exists. Tap 'Log In'."); return; }

        const userData = { phone: phoneKey, name: name, pin: pin };
        await push(userRef, userData);
        
        currentUser = { uid: phoneKey, phone: phoneKey, name: name };
        localStorage.setItem("bbchat_user_session", JSON.stringify(currentUser));
        
        authScreen.classList.add("hidden");
        document.getElementById("header-name").innerText = currentUser.name;
        listenForMessages();
        setupOnlineStatus();
      } else {
        if (!dbSnap.exists()) { alert("Account not found. Switch to 'Create Account'."); return; }

        let validUser = null;
        dbSnap.forEach((child) => {
          const val = child.val();
          if (val && val.pin === pin) validUser = val;
        });

        if (validUser) {
          currentUser = { uid: phoneKey, phone: phoneKey, name: validUser.name };
          localStorage.setItem("bbchat_user_session", JSON.stringify(currentUser));
          authScreen.classList.add("hidden");
          document.getElementById("header-name").innerText = currentUser.name;
          listenForMessages();
          setupOnlineStatus();
        } else {
          alert("Incorrect PIN.");
        }
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("bbchat_user_session");
      location.reload();
    });

    // Real-time Connection Monitor
    function setupOnlineStatus() {
      const connectedRef = dbRef(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          statusDot.classList.add("online");
          statusText.innerText = "Online";
        } else {
          statusDot.classList.remove("online");
          statusText.innerText = "Offline";
        }
      });
    }

    // Send Message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== "" && currentUser) {
        push(dbRef(db, "messages"), { 
          uid: currentUser.uid, 
          sender: currentUser.name, 
          text: text, 
          image: null,
          timestamp: Date.now()
        });
        messageInput.value = "";
      }
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    // FIXED IMGBB IMAGE UPLOAD
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;

      const formData = new FormData();
      formData.append("image", file);

      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        
        const result = await res.json();

        if (result.success && result.data && result.data.url) {
          push(dbRef(db, "messages"), {
            uid: currentUser.uid,
            sender: currentUser.name,
            text: "",
            image: result.data.url,
            timestamp: Date.now()
          });
        } else {
          alert("Image upload failed. Try a smaller image.");
        }
      } catch (err) {
        alert("Upload error: " + err.message);
      }
      fileInput.value = "";
    });

    // Modal Image Preview
    imageModal.addEventListener("click", () => imageModal.classList.add("hidden"));

    // Realtime Message Sync
    function listenForMessages() {
      chatBox.innerHTML = "";
      
      onChildAdded(dbRef(db, "messages"), (snapshot) => {
        const msgId = snapshot.key;
        const data = snapshot.val();
        const isMe = currentUser && data.uid === currentUser.uid;

        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${isMe ? "sent" : "received"}`;
        msgDiv.id = `msg-${msgId}`;
        
        let content = `<div class="msg-author">${data.sender}</div>`;
        if (data.text) content += `<div>${data.text}</div>`;
        if (data.image) content += `<img src="${data.image}" alt="photo" class="chat-img" />`;
        content += `<div class="msg-time">${formatTime(data.timestamp)}</div>`;
        
        msgDiv.innerHTML = content;

        // Image Click Handler
        const imgEl = msgDiv.querySelector(".chat-img");
        if (imgEl) {
          imgEl.addEventListener("click", (e) => {
            e.stopPropagation();
            modalImg.src = data.image;
            imageModal.classList.remove("hidden");
          });
        }

        // Tap to Delete own messages
        if (isMe) {
          msgDiv.addEventListener("click", async () => {
            if (confirm("Delete this message?")) {
              await remove(dbRef(db, `messages/${msgId}`));
            }
          });
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      onChildRemoved(dbRef(db, "messages"), (snapshot) => {
        const msgDiv = document.getElementById(`msg-${snapshot.key}`);
        if (msgDiv) msgDiv.remove();
      });
    }
  </script>
</body>
</html>
