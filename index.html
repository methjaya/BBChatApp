<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BBChatApp</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FFE9A0' stroke='%2318181B' stroke-width='8'/><text x='50' y='62' font-family='sans-serif' font-size='32' font-weight='900' fill='%2318181B' text-anchor='middle'>BBC</text></svg>">

  <style>
    :root {
      --bg-color: #F6F3EC;
      --card-bg: #FFFFFF;
      --border: 2.5px solid #18181B;
      --shadow: 4px 4px 0px #18181B;
      --shadow-sm: 2.5px 2.5px 0px #18181B;
      --purple: #E2D4FF;
      --pink: #FFD2DD;
      --green: #C1F0C6;
      --yellow: #FFE9A0;
      --blue: #A2D2FF;
      --text-dark: #18181B;
      --text-gray: #6B7280;
      --danger: #FF6B6B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #18181B; display: flex; justify-content: center; align-items: center; }
    #app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--bg-color); position: relative; overflow: hidden; border: var(--border); box-shadow: var(--shadow); }
    
    .screen { position: absolute; inset: 0; background: var(--bg-color); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; overflow-y: auto; }
    .hidden { display: none !important; }

    .bb-logo-badge {
      padding: 14px 28px; background: var(--yellow); border: var(--border); border-radius: 20px;
      display: flex; align-items: center; justify-content: center; color: var(--text-dark); font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 20px; box-shadow: var(--shadow);
    }

    h1 { font-size: 26px; font-weight: 900; margin-bottom: 6px; color: var(--text-dark); letter-spacing: -0.5px; }
    p { font-size: 14px; color: var(--text-dark); font-weight: 600; margin-bottom: 24px; line-height: 1.4; }

    .auth-toggle { display: flex; background: #E5E0D8; border: var(--border); border-radius: 16px; padding: 4px; width: 100%; margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 14px; font-weight: 800; color: var(--text-dark); border-radius: 12px; cursor: pointer; transition: all 0.2s; }
    .auth-tab.active { background: var(--purple); border: var(--border); box-shadow: var(--shadow-sm); }

    .input-group { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .otp-row { display: flex; gap: 8px; }
    input { width: 100%; padding: 14px 16px; border-radius: 16px; border: var(--border); font-size: 15px; font-weight: 700; outline: none; background: var(--card-bg); color: var(--text-dark); box-shadow: var(--shadow-sm); }
    input:focus { background: #FFFFFF; transform: translate(-1px, -1px); box-shadow: var(--shadow); }

    .phone-hint { font-size: 12px; font-weight: 800; color: #2B8A3E; text-align: left; padding-left: 4px; }
    .status-badge { width: 100%; padding: 10px; border-radius: 12px; border: var(--border); font-size: 12px; font-weight: 800; display: none; margin-bottom: 12px; }
    .status-badge.error { background: #FFE3E3; color: #D6336C; }
    .status-badge.info { background: #D3F9D8; color: #2B8A3E; }

    .btn { width: 100%; padding: 16px; border-radius: 16px; border: var(--border); font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transition: transform 0.1s; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1.5px 1.5px 0px #18181B; }
    .btn-primary { background: var(--purple); color: var(--text-dark); }
    .btn-sm { padding: 12px 14px; font-size: 13px; width: auto; white-space: nowrap; background: var(--blue); border: var(--border); border-radius: 14px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-sm); }

    .forgot-link { color: var(--text-dark); font-size: 13px; font-weight: 800; text-decoration: underline; cursor: pointer; margin-top: 10px; display: inline-block; }

    #home-screen { position: absolute; inset: 0; background: var(--bg-color); z-index: 15; display: flex; flex-direction: column; overflow: hidden; }
    .home-header { height: 64px; background: var(--card-bg); border-bottom: var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .home-title { font-size: 18px; font-weight: 900; color: var(--text-dark); }
    .home-header-btns { display: flex; gap: 8px; }
    
    .home-actions-bar { padding: 16px 16px 4px 16px; }
    .add-friend-btn {
      background: var(--pink); color: var(--text-dark); border: var(--border); border-radius: 18px;
      padding: 14px 16px; font-size: 14px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
      box-shadow: var(--shadow); transition: transform 0.1s;
    }

    .members-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }

    .member-card {
      background: var(--card-bg); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: var(--border); box-shadow: var(--shadow); transition: transform 0.1s ease;
    }
    .member-card:active { transform: translate(2px, 2px); box-shadow: 1.5px 1.5px 0px #18181B; }
    .member-card-info { display: flex; align-items: center; gap: 14px; }
    .member-avatar { width: 46px; height: 46px; border-radius: 14px; background: var(--blue); border: var(--border); color: var(--text-dark); font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
    .member-details .member-name { font-size: 16px; font-weight: 800; color: var(--text-dark); margin-bottom: 2px; }
    .member-details .member-phone { font-size: 12px; font-weight: 700; color: var(--text-gray); }
    .chat-now-badge { background: var(--green); color: var(--text-dark); font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 14px; border: var(--border); box-shadow: var(--shadow-sm); }

    header { height: 64px; background: var(--card-bg); border-bottom: var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .header-bb-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--yellow); border: var(--border); color: var(--text-dark); font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
    .user-details { text-align: left; }
    .user-details .name { font-size: 15px; font-weight: 800; color: var(--text-dark); line-height: 1.2; }
    .user-details .status { font-size: 11px; color: var(--text-dark); font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #8E8E93; border: 1.5px solid #18181B; display: inline-block; }
    .status-dot.online { background: #51CF66; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: var(--bg-color); border: var(--border); border-radius: 12px; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px 10px; font-weight: 800; box-shadow: var(--shadow-sm); }

    #chat-box { flex: 1; overflow-y: auto; padding: 80px 14px 76px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-color); -webkit-overflow-scrolling: touch; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 14px; font-weight: 600; line-height: 1.4; word-break: break-word; position: relative; animation: fadeIn 0.15s ease-out; cursor: pointer; user-select: none; border: var(--border); box-shadow: var(--shadow-sm); }
    .sent { align-self: flex-end; background: var(--purple); color: var(--text-dark); border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: var(--card-bg); color: var(--text-dark); border-bottom-left-radius: 4px; }
    .msg-deleted { font-style: italic; opacity: 0.8; background: #E5E0D8 !important; }
    .msg img { max-width: 100%; max-height: 220px; border-radius: 12px; margin-top: 6px; display: block; object-fit: cover; border: var(--border); }
    .msg audio { max-width: 220px; height: 38px; margin-top: 6px; border-radius: 18px; outline: none; }
    .msg-author { font-size: 11px; opacity: 0.8; margin-bottom: 2px; font-weight: 800; text-transform: uppercase; }
    .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; font-weight: 700; opacity: 0.75; }

    footer { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: var(--border); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; z-index: 10; }
    .file-btn { color: var(--text-dark); cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; background: var(--yellow); border: var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); }
    #file-input { display: none; }
    #message-input { flex: 1; height: 40px; border-radius: 14px; border: var(--border); padding: 0 14px; font-size: 14px; font-weight: 700; outline: none; background: var(--bg-color); color: var(--text-dark); margin-bottom: 0; }
    .send-btn { background: var(--green); color: var(--text-dark); border: var(--border); width: 40px; height: 40px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: var(--shadow-sm); }
    .mic-btn { background: var(--pink); border: var(--border); border-radius: 12px; color: var(--text-dark); cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
    .mic-btn.recording { background: var(--danger); color: white; animation: pulse 0.8s infinite alternate; }

    .action-sheet-overlay { position: fixed; inset: 0; background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(2px); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; animation: fadeIn 0.2s ease-out; }
    .action-sheet { background: var(--card-bg); border: var(--border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 8px; box-shadow: var(--shadow); }
    .action-btn { padding: 16px; border: none; background: transparent; font-size: 15px; font-weight: 800; color: var(--text-dark); border-bottom: var(--border); cursor: pointer; text-align: center; }
    .action-btn.danger { color: var(--danger); }
    .action-cancel { background: var(--yellow); border-radius: 18px; font-weight: 800; color: var(--text-dark); border: var(--border); padding: 16px; font-size: 15px; cursor: pointer; text-align: center; box-shadow: var(--shadow); }

    .edit-modal-box { background: var(--card-bg); border: var(--border); border-radius: 22px; padding: 22px; width: 90%; max-width: 360px; margin: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
    .edit-modal-box h3 { font-size: 18px; font-weight: 900; text-align: center; color: var(--text-dark); }
    .edit-modal-actions { display: flex; gap: 10px; margin-top: 4px; }

    .call-screen { position: fixed; inset: 0; background: var(--bg-color); color: var(--text-dark); z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 24px; text-align: center; }
    .call-avatar { width: 100px; height: 100px; border-radius: 28px; background: var(--blue); border: var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; margin-bottom: 16px; box-shadow: var(--shadow); }
    .call-status { font-size: 15px; font-weight: 700; color: var(--text-gray); margin-top: 8px; }
    .call-actions { display: flex; gap: 24px; width: 100%; justify-content: center; }
    .call-btn { width: 64px; height: 64px; border-radius: 20px; border: var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
    .call-btn.accept { background: var(--green); color: var(--text-dark); }
    .call-btn.decline { background: var(--danger); color: white; }

    #image-modal { position: fixed; inset: 0; background: rgba(24, 24, 27, 0.95); z-index: 110; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #image-modal img { max-width: 100%; max-height: 90vh; border-radius: 16px; border: var(--border); object-fit: contain; }
  </style>
</head>
<body>

  <!-- Invisible Recaptcha Element -->
  <div id="recaptcha-container"></div>

  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="bb-logo-badge">BBChatApp</div>
      <h1>BBChatApp</h1>
      <p id="auth-desc">Sign in with Mobile Phone & PIN</p>

      <div id="auth-status-box" class="status-badge"></div>

      <div class="auth-toggle">
        <button id="tab-login" class="auth-tab active">Log In</button>
        <button id="tab-register" class="auth-tab">Register</button>
      </div>

      <div class="input-group">
        <div class="otp-row">
          <input type="tel" id="auth-phone" placeholder="0701581056" autocomplete="tel" />
          <button id="send-otp-btn" class="btn-sm hidden">Send OTP</button>
        </div>
        <div id="phone-hint" class="phone-hint"></div>
        <input type="text" id="auth-name" class="hidden" placeholder="Your Display Name" autocomplete="name" />
        <input type="password" id="auth-pin" maxlength="6" pattern="\d*" placeholder="4-Digit PIN" />
        <input type="text" id="auth-otp" class="hidden" maxlength="6" placeholder="6-Digit Verification Code" />
      </div>

      <button id="auth-btn" class="btn btn-primary">Log In</button>
      <span id="forgot-pin-btn" class="forgot-link">Forgot PIN?</span>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="hidden">
      <div class="home-header">
        <div class="home-title">BBChatApp</div>
        <div class="home-header-btns">
          <!-- RESTRICTED BUTTON: Visible ONLY for phone 0701581056 -->
          <button id="reset-system-btn" class="hidden" style="background:var(--danger); color:white; border:var(--border); border-radius:10px; font-size:11px; font-weight:800; padding:6px 10px; cursor:pointer; box-shadow:var(--shadow-sm);">Reset System</button>
          <button id="home-logout-btn" style="background:none; border:none; color:var(--text-dark); font-size:14px; font-weight: 800; cursor:pointer;">Exit</button>
        </div>
      </div>
      
      <div class="home-actions-bar">
        <button id="open-add-friend-btn" class="add-friend-btn">
          <span>+</span> Add Friend by Phone or Name
        </button>
      </div>

      <div id="members-list" class="members-list"></div>
    </div>

    <!-- Chat Header -->
    <header>
      <div class="header-info">
        <div class="header-bb-icon">BBC</div>
        <div class="user-details">
          <div id="header-name" class="name">Chat Room</div>
          <div class="status">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Connecting...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="back-to-home-btn" class="icon-btn" title="Friends List" style="font-size:12px;">Friends</button>
        <button id="start-call-btn" class="icon-btn" title="Voice Call">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <label for="file-input" class="file-btn" id="file-label">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </label>
      <input type="file" id="file-input" accept="image/*" />

      <button id="mic-btn" class="mic-btn" title="Record Voice Note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <input type="text" id="message-input" placeholder="Message..." autocomplete="off" />
      <button id="send-btn" class="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </footer>
  </div>

  <!-- Add Friend Modal -->
  <div id="add-friend-modal" class="action-sheet-overlay hidden" style="justify-content: center;">
    <div class="edit-modal-box">
      <h3>Add Friend</h3>
      <p style="font-size:12px; color:var(--text-gray); text-align:center; margin-bottom:2px;">Enter friend's phone number or display name.</p>
      <input type="text" id="add-friend-input" placeholder="Phone number or Name" />
      <div class="edit-modal-actions">
        <button id="add-friend-cancel-btn" class="btn" style="background: #E5E0D8; color: var(--text-dark);">Cancel</button>
        <button id="add-friend-search-btn" class="btn btn-primary">Add</button>
      </div>
    </div>
  </div>

  <!-- Real OTP Forgot PIN Modal -->
  <div id="forgot-pin-modal" class="action-sheet-overlay hidden" style="justify-content: center;">
    <div class="edit-modal-box">
      <h3>Reset PIN</h3>
      <div class="otp-row">
        <input type="tel" id="reset-phone" placeholder="0701581056" />
        <button id="reset-send-otp-btn" class="btn-sm">Send Code</button>
      </div>
      <input type="text" id="reset-otp-code" maxlength="6" placeholder="Enter 6-Digit Code" />
      <input type="password" id="reset-new-pin" maxlength="6" pattern="\d*" placeholder="New 4-Digit PIN" />
      <div class="edit-modal-actions">
        <button id="reset-cancel-btn" class="btn" style="background: #E5E0D8; color: var(--text-dark);">Cancel</button>
        <button id="reset-submit-btn" class="btn btn-primary">Verify & Reset</button>
      </div>
    </div>
  </div>

  <!-- Action Sheet Overlay for Message Options -->
  <div id="action-sheet-overlay" class="action-sheet-overlay hidden">
    <div class="action-sheet" id="action-sheet-buttons"></div>
    <button class="action-cancel" id="action-sheet-cancel">Cancel</button>
  </div>

  <!-- Edit Message Modal -->
  <div id="edit-modal-overlay" class="action-sheet-overlay hidden" style="justify-content: center;">
    <div class="edit-modal-box">
      <h3>Edit Message</h3>
      <input type="text" id="edit-message-input" placeholder="Edit message..." />
      <div class="edit-modal-actions">
        <button id="edit-cancel-btn" class="btn" style="background: #E5E0D8; color: var(--text-dark);">Cancel</button>
        <button id="edit-save-btn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="image-modal" class="hidden">
    <img id="modal-img" src="" alt="Full view" />
  </div>

  <div id="call-screen" class="call-screen hidden">
    <div>
      <div class="call-avatar" id="call-avatar-icon">BBC</div>
      <h2 id="call-user-title">Voice Call</h2>
      <div id="call-status-label" class="call-status">Connecting...</div>
    </div>
    <div class="call-actions">
      <button id="accept-call-btn" class="call-btn accept hidden">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button id="hangup-call-btn" class="call-btn decline">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // SRI LANKAN PHONE NUMBER AUTO-FORMATTER
    function formatSriLankanPhone(phone) {
      let cleaned = phone.replace(/[^0-9+]/g, "");
      if (cleaned.length === 10 && cleaned.startsWith("07")) {
        return "+94" + cleaned.substring(1); // Converts 0701581056 -> +94701581056
      }
      if (cleaned.length === 9 && cleaned.startsWith("7")) {
        return "+94" + cleaned;
      }
      if (cleaned.startsWith("+")) return cleaned;
      return "+" + cleaned;
    }

    function cleanPhone(phone) { return phone.replace(/[^0-9]/g, ""); }
    function formatTime(timestamp) {
      if (!timestamp) return "";
      return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Send Real Firebase SMS OTP

      const formattedNumber = formatSriLankanPhone(rawPhoneNumber);

      buttonEl.innerText = "Sending...";
      buttonEl.disabled = true;

        displayAuthStatus(`SMS code sent to ${formattedNumber}`, false);
        buttonEl.innerText = "Sent!";

        console.error("SMS Error:", error);
        displayAuthStatus("SMS Error: " + error.message, true);
        buttonEl.innerText = "Send OTP";
        buttonEl.disabled = false;
        if (window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
      }
    }

    // HTML5 CANVAS CLIENT COMPRESSION (Prevents upload failures)
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          const maxDim = 600;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);

          push(dbRef(db, "messages"), {
            uid: currentUser.uid,
            sender: currentUser.name,
            text: "",
            image: compressedBase64,
            audio: null,
            timestamp: Date.now(),
            edited: false,
            deletedForEveryone: false
          });
        };
        img.src = event.target.result;
      };

      fileInput.value = "";
    });

    micBtn.addEventListener("click", async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          let options = {};
          if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
          else if (MediaRecorder.isTypeSupported('audio/aac')) options = { mimeType: 'audio/aac' };

          mediaRecorder = new MediaRecorder(stream, options);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            const mimeType = mediaRecorder.mimeType || 'audio/mp4';
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64Audio = reader.result;
              push(dbRef(db, "messages"), {
                uid: currentUser.uid, sender: currentUser.name, text: "",
                image: null, audio: base64Audio, timestamp: Date.now(),
                edited: false, deletedForEveryone: false
              });
            };
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add("recording");
        } catch (err) { alert("Microphone permission required."); }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove("recording");
      }
    });

    function renderMessageHTML(msgId, data) {
      const isMe = currentUser && data.uid === currentUser.uid;
      if (data.deletedFor && data.deletedFor[currentUser.uid]) return null;

      const msgDiv = document.createElement("div");
      if (data.deletedForEveryone) {
        msgDiv.className = `msg ${isMe ? "sent" : "received"} msg-deleted`;
        msgDiv.id = `msg-${msgId}`;
        msgDiv.innerHTML = `<div class="msg-author">${data.sender}</div><div>This message was deleted</div><div class="msg-footer"><span>${formatTime(data.timestamp)}</span></div>`;
        return msgDiv;
      }

      msgDiv.className = `msg ${isMe ? "sent" : "received"}`;
      msgDiv.id = `msg-${msgId}`;
      let content = `<div class="msg-author">${data.sender}</div>`;
      if (data.text) content += `<div>${data.text}</div>`;
      if (data.image) content += `<img src="${data.image}" alt="photo" class="chat-img" />`;
      if (data.audio) content += `<audio controls playsinline src="${data.audio}"></audio>`;
      
      content += `<div class="msg-footer">${data.edited ? '<span class="edited-tag">edited</span> • ' : ''}<span>${formatTime(data.timestamp)}</span></div>`;
      msgDiv.innerHTML = content;

      const imgEl = msgDiv.querySelector(".chat-img");
      if (imgEl) {
        imgEl.addEventListener("click", (e) => {
          e.stopPropagation();
          modalImg.src = data.image;
          imageModal.classList.remove("hidden");
        });
      }

      msgDiv.addEventListener("click", () => openActionSheet(msgId, data));
      return msgDiv;
    }

    function openActionSheet(msgId, data) {
      if (data.deletedForEveryone) return;
      activeSelectedMsg = { id: msgId, ...data };
      actionSheetButtons.innerHTML = "";

      const isMe = currentUser && data.uid === currentUser.uid;
      const isWithinOneMin = (Date.now() - data.timestamp) <= 60000;

      if (isMe && isWithinOneMin && data.text && !data.image && !data.audio) {
        const editBtn = document.createElement("button");
        editBtn.className = "action-btn";
        editBtn.innerText = "Edit Message";
        editBtn.addEventListener("click", () => {
          closeActionSheet();
          editMessageInput.value = data.text;
          editModalOverlay.classList.remove("hidden");
        });
        actionSheetButtons.appendChild(editBtn);
      }

      if (isMe && isWithinOneMin) {
        const delEveryoneBtn = document.createElement("button");
        delEveryoneBtn.className = "action-btn danger";
        delEveryoneBtn.innerText = "Delete for Everyone";
        delEveryoneBtn.addEventListener("click", async () => {
          closeActionSheet();
          await update(dbRef(db, `messages/${msgId}`), { deletedForEveryone: true, text: "", image: null, audio: null });
        });
        actionSheetButtons.appendChild(delEveryoneBtn);
      }

      const delMeBtn = document.createElement("button");
      delMeBtn.className = "action-btn danger";
      delMeBtn.innerText = "Delete for Me";
      delMeBtn.addEventListener("click", async () => {
        closeActionSheet();
        await update(dbRef(db, `messages/${msgId}/deletedFor`), { [currentUser.uid]: true });
        const el = document.getElementById(`msg-${msgId}`);
        if (el) el.remove();
      });
      actionSheetButtons.appendChild(delMeBtn);

      actionSheetOverlay.classList.remove("hidden");
    }

    function closeActionSheet() { actionSheetOverlay.classList.add("hidden"); }

    // Detaches previous listeners (Prevents duplicate messages)
    function listenForMessages() {
      const messagesRef = dbRef(db, "messages");
      off(messagesRef);
      chatBox.innerHTML = "";

      onChildAdded(messagesRef, (snapshot) => {
        const msgDiv = renderMessageHTML(snapshot.key, snapshot.val());
        if (msgDiv) { chatBox.appendChild(msgDiv); chatBox.scrollTop = chatBox.scrollHeight; }
      });

      onChildChanged(messagesRef, (snapshot) => {
        const msgId = snapshot.key;
        const existingDiv = document.getElementById(`msg-${msgId}`);
        const updatedDiv = renderMessageHTML(msgId, snapshot.val());
        if (existingDiv) {
          if (updatedDiv) existingDiv.replaceWith(updatedDiv);
          else existingDiv.remove();
        } else if (updatedDiv) {
          chatBox.appendChild(updatedDiv); chatBox.scrollTop = chatBox.scrollHeight;
        }
      });

      onChildRemoved(messagesRef, (snapshot) => {
        const msgDiv = document.getElementById(`msg-${snapshot.key}`);
        if (msgDiv) msgDiv.remove();
      });
    }

    startCallBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        peerConnection = new RTCPeerConnection(rtcServers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => { remoteAudio.srcObject = event.streams[0]; };

        const callRoomRef = dbRef(db, "active_call");
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) push(child(callRoomRef, "callerCandidates"), event.candidate.toJSON());
        };

        const offerDescription = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offerDescription);

        await set(callRoomRef, {
          offer: { type: offerDescription.type, sdp: offerDescription.sdp },
          callerName: currentUser.name, callerUid: currentUser.uid, status: "calling"
        });

        callUserTitle.innerText = "Calling...";
        callStatusLabel.innerText = "Ringing...";
        acceptCallBtn.classList.add("hidden");
        callScreen.classList.remove("hidden");

        onValue(child(callRoomRef, "answer"), (snapshot) => {
          const answer = snapshot.val();
          if (answer && peerConnection && !peerConnection.currentRemoteDescription) {
            peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            callStatusLabel.innerText = "Connected";
          }
        });

        onChildAdded(child(callRoomRef, "calleeCandidates"), (snapshot) => {
          if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
        });

        onValue(child(callRoomRef, "status"), (snapshot) => {
          if (snapshot.val() === "ended") endCall(false);
        });
      } catch (err) { alert("Microphone access failed."); }
    });

    function listenForIncomingCalls() {
      const callRoomRef = dbRef(db, "active_call");
      onValue(callRoomRef, async (snapshot) => {
        const data = snapshot.val();
        if (data && data.status === "calling" && data.callerUid !== currentUser.uid) {
          callUserTitle.innerText = data.callerName;
          callStatusLabel.innerText = "Incoming Voice Call";
          acceptCallBtn.classList.remove("hidden");
          callScreen.classList.remove("hidden");

          acceptCallBtn.onclick = async () => {
            acceptCallBtn.classList.add("hidden");
            callStatusLabel.innerText = "Connecting...";

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            peerConnection = new RTCPeerConnection(rtcServers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => { remoteAudio.srcObject = event.streams[0]; };

            peerConnection.onicecandidate = (event) => {
              if (event.candidate) push(child(callRoomRef, "calleeCandidates"), event.candidate.toJSON());
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answerDescription = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answerDescription);

            await update(callRoomRef, {
              answer: { type: answerDescription.type, sdp: answerDescription.sdp },
              status: "connected"
            });

            onChildAdded(child(callRoomRef, "callerCandidates"), (snapshot) => {
              if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
            });

            callStatusLabel.innerText = "Connected";
          };
        } else if (!data || data.status === "ended") { endCall(false); }
      });
    }

    hangupCallBtn.addEventListener("click", () => endCall(true));

    async function endCall(notifyPeer = true) {
      if (notifyPeer) {
        await update(dbRef(db, "active_call"), { status: "ended" });
        setTimeout(() => remove(dbRef(db, "active_call")), 1000);
      }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
      callScreen.classList.add("hidden");
    }
  </script>
</body>
