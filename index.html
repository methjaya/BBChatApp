<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BBChatApp</title>
  
  <!-- SVG Favicon with BBChatApp Logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23007AFF'/><text x='50' y='60' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='32' font-weight='900' fill='white' text-anchor='middle'>BBC</text></svg>">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --primary: #007aff;
      --sent-bg: #007aff;
      --received-bg: #e5e5ea;
      --text-dark: #000000;
      --text-gray: #8e8e93;
      --border-color: #d1d1d6;
      --danger: #ff3b30;
      --success: #34c759;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #1c1c1e; display: flex; justify-content: center; align-items: center; }
    
    #app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--card-bg); position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.3); }
    
    /* Screens */
    .screen { position: absolute; inset: 0; background: var(--card-bg); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    .hidden { display: none !important; }

    /* BBChatApp Logo Badge */
    .bb-logo-badge {
      padding: 16px 24px;
      background: linear-gradient(135deg, #007aff, #0051a8);
      border-radius: 22px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 20px;
      box-shadow: 0 12px 24px rgba(0, 122, 255, 0.3), inset 0 1px 1px rgba(255,255,255,0.4);
    }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); letter-spacing: -0.5px; }
    p { font-size: 14px; color: var(--text-gray); margin-bottom: 24px; line-height: 1.4; }

    .auth-toggle { display: flex; background: #e5e5ea; border-radius: 10px; padding: 3px; width: 100%; margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-gray); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .auth-tab.active { background: white; color: var(--text-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

    .input-group { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 16px; outline: none; background: #f9f9f9; color: var(--text-dark); appearance: none; }
    input:focus { border-color: var(--primary); background: #ffffff; }

    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--primary); color: white; }

    /* Home Dashboard Screen */
    #home-screen { position: absolute; inset: 0; background: #f2f2f7; z-index: 15; display: flex; flex-direction: column; overflow: hidden; }
    .home-header { height: 64px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .home-title { font-size: 20px; font-weight: 800; color: var(--text-dark); }
    .members-list { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }

    /* 3D Elegant Drop-Shadowed Cards */
    .member-card {
      background: linear-gradient(145deg, #ffffff, #f7f9fc);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 12px 24px -6px rgba(0, 122, 255, 0.15),
        0 4px 12px rgba(0, 0, 0, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: translateZ(0);
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .member-card:active {
      transform: scale(0.97) translateY(2px);
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.1);
    }
    .member-card-info { display: flex; align-items: center; gap: 14px; }
    .member-avatar {
      width: 48px; height: 48px; border-radius: 16px;
      background: linear-gradient(135deg, #007aff, #0051a8);
      color: white; font-weight: 800; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 12px rgba(0, 122, 255, 0.3);
    }
    .member-details .member-name { font-size: 17px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
    .member-details .member-phone { font-size: 12px; color: var(--text-gray); }
    .chat-now-badge {
      background: #e5f1ff; color: var(--primary); font-size: 13px; font-weight: 700;
      padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(0, 122, 255, 0.15);
    }

    /* Chat Header */
    header { height: 60px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .header-bb-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); color: white; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .user-details { text-align: left; }
    .user-details .name { font-size: 15px; font-weight: 700; color: var(--text-dark); line-height: 1.2; }
    .user-details .status { font-size: 12px; color: var(--text-gray); font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; display: inline-block; }
    .status-dot.online { background: var(--success); }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: none; border: none; color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; }

    /* Chat Area */
    #chat-box { flex: 1; overflow-y: auto; padding: 72px 14px 72px 14px; display: flex; flex-direction: column; gap: 8px; background: #ffffff; -webkit-overflow-scrolling: touch; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-break: break-word; position: relative; animation: fadeIn 0.15s ease-out; cursor: pointer; user-select: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .sent { align-self: flex-end; background: var(--sent-bg); color: white; border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: var(--received-bg); color: var(--text-dark); border-bottom-left-radius: 4px; }
    
    .msg-deleted { font-style: italic; opacity: 0.75; }
    .sent.msg-deleted { background: #0051a8; }
    .received.msg-deleted { background: #e5e5ea; color: #8e8e93; }

    .msg img { max-width: 100%; max-height: 240px; border-radius: 12px; margin-top: 4px; display: block; object-fit: cover; }
    .msg audio { max-width: 220px; height: 40px; margin-top: 4px; border-radius: 20px; outline: none; }
    .msg-author { font-size: 11px; opacity: 0.7; margin-bottom: 2px; font-weight: 600; }
    .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; font-size: 10px; opacity: 0.65; }
    .edited-tag { font-style: italic; }

    /* Input Footer */
    footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border-color); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; z-index: 10; }
    .file-btn { color: var(--primary); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    #file-input { display: none; }
    #message-input { flex: 1; height: 38px; border-radius: 19px; border: 1px solid var(--border-color); padding: 0 14px; font-size: 15px; outline: none; background: #f2f2f7; color: var(--text-dark); margin-bottom: 0; }
    .send-btn { background: var(--primary); color: white; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    
    .mic-btn { background: none; border: none; color: var(--primary); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .mic-btn.recording { color: var(--danger); animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.18); } }

    /* Action Sheet / Options Modal */
    .action-sheet-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; animation: fadeIn 0.2s ease-out; }
    .action-sheet { background: rgba(255, 255, 255, 0.95); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 8px; }
    .action-btn { padding: 16px; border: none; background: transparent; font-size: 16px; font-weight: 500; color: var(--primary); border-bottom: 0.5px solid var(--border-color); cursor: pointer; text-align: center; }
    .action-btn:last-child { border-bottom: none; }
    .action-btn.danger { color: var(--danger); font-weight: 600; }
    .action-cancel { background: white; border-radius: 16px; font-weight: 600; color: var(--primary); border: none; padding: 16px; font-size: 16px; cursor: pointer; text-align: center; }

    /* Edit Input Box Modal */
    .edit-modal-box { background: white; border-radius: 18px; padding: 20px; width: 90%; max-width: 360px; margin: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .edit-modal-box h3 { font-size: 18px; font-weight: 600; text-align: center; }
    .edit-modal-actions { display: flex; gap: 10px; }

    /* Call Modal UI */
    .call-screen { position: fixed; inset: 0; background: #1c1c1e; color: white; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 24px; text-align: center; }
    .call-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; margin-bottom: 16px; box-shadow: 0 0 30px rgba(0,122,255,0.4); }
    .call-status { font-size: 15px; color: var(--text-gray); margin-top: 8px; }
    .call-actions { display: flex; gap: 24px; width: 100%; justify-content: center; }
    .call-btn { width: 64px; height: 64px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .call-btn.accept { background: var(--success); color: white; }
    .call-btn.decline { background: var(--danger); color: white; }

    /* Fullscreen Image Preview Modal */
    #image-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 110; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #image-modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; object-fit: contain; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="bb-logo-badge">BBChatApp</div>
      <h1>BBChatApp</h1>
      <p id="auth-desc">Sign in with your Mobile Phone & PIN.</p>

      <div class="auth-toggle">
        <button id="tab-login" class="auth-tab active">Log In</button>
        <button id="tab-register" class="auth-tab">Create Account</button>
      </div>

      <div class="input-group">
        <input type="tel" id="auth-phone" placeholder="Mobile Phone Number" autocomplete="tel" />
        <input type="text" id="auth-name" class="hidden" placeholder="Your Display Name" autocomplete="name" />
        <input type="password" id="auth-pin" maxlength="6" pattern="\d*" placeholder="4-Digit PIN" />
      </div>

      <button id="auth-btn" class="btn btn-primary">Log In</button>
    </div>

    <!-- Home Screen (3D Member Dashboard) -->
    <div id="home-screen" class="hidden">
      <div class="home-header">
        <div class="home-title">BBChatApp Members</div>
        <button id="home-logout-btn" style="background:none; border:none; color:var(--primary); font-size:15px; font-weight: 600; cursor:pointer;">Exit</button>
      </div>
      <div id="members-list" class="members-list"></div>
    </div>

    <!-- Chat Header -->
    <header>
      <div class="header-info">
        <div class="header-bb-icon">BBC</div>
        <div class="user-details">
          <div id="header-name" class="name">Chat Room</div>
          <div class="status">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Connecting...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <!-- Return to Members Button -->
        <button id="back-to-home-btn" class="icon-btn" title="Members List" style="font-size:13px; font-weight:600;">
          Members
        </button>
        <!-- Voice Call Icon -->
        <button id="start-call-btn" class="icon-btn" title="Voice Call">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <!-- Camera Button -->
      <label for="file-input" class="file-btn" id="file-label">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </label>
      <input type="file" id="file-input" accept="image/*" />

      <!-- Mic / Voice Note Button -->
      <button id="mic-btn" class="mic-btn" title="Record Voice Note">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <input type="text" id="message-input" placeholder="Message" autocomplete="off" />
      <button id="send-btn" class="send-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </footer>
  </div>

  <!-- Action Sheet Overlay for Message Options -->
  <div id="action-sheet-overlay" class="action-sheet-overlay hidden">
    <div class="action-sheet" id="action-sheet-buttons"></div>
    <button class="action-cancel" id="action-sheet-cancel">Cancel</button>
  </div>

  <!-- Edit Message Modal -->
  <div id="edit-modal-overlay" class="action-sheet-overlay hidden" style="justify-content: center;">
    <div class="edit-modal-box">
      <h3>Edit Message</h3>
      <input type="text" id="edit-message-input" placeholder="Edit message..." />
      <div class="edit-modal-actions">
        <button id="edit-cancel-btn" class="btn" style="background: #e5e5ea; color: #000;">Cancel</button>
        <button id="edit-save-btn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Image Viewer Modal -->
  <div id="image-modal" class="hidden">
    <img id="modal-img" src="" alt="Full view" />
  </div>

  <!-- Voice Call UI Screen -->
  <div id="call-screen" class="call-screen hidden">
    <div>
      <div class="call-avatar" id="call-avatar-icon">BBC</div>
      <h2 id="call-user-title">Voice Call</h2>
      <div id="call-status-label" class="call-status">Connecting...</div>
    </div>
    <div class="call-actions">
      <button id="accept-call-btn" class="call-btn accept hidden">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button id="hangup-call-btn" class="call-btn decline">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push, update, onChildAdded, onChildChanged, onChildRemoved, get, child, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCumpuLgLQim1FAiibLIQKHGyzNcGyLTcs",
      authDomain: "bbchat-app.firebaseapp.com",
      databaseURL: "https://bbchat-app-default-rtdb.firebaseio.com",
      projectId: "bbchat-app",
      storageBucket: "bbchat-app.firebasestorage.app",
      messagingSenderId: "798098467106",
      appId: "1:798098467106:web:368f89dee243b547d4dd7b",
      measurementId: "G-PNKYJQJT9V"
    };

    const IMGBB_API_KEY = "874affb0b9a32ab658bf8d4ba86d28bg";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let selectedMember = null;
    let isRegisterMode = false;
    let activeSelectedMsg = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    let peerConnection = null;
    let localStream = null;

    const rtcServers = {
      iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }]
    };

    // DOM Elements
    const authScreen = document.getElementById("auth-screen");
    const homeScreen = document.getElementById("home-screen");
    const membersList = document.getElementById("members-list");

    const authPhone = document.getElementById("auth-phone");
    const authName = document.getElementById("auth-name");
    const authPin = document.getElementById("auth-pin");
    const authBtn = document.getElementById("auth-btn");
    const authDesc = document.getElementById("auth-desc");
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");

    const chatBox = document.getElementById("chat-box");
    const messageInput = document.getElementById("message-input");
    const fileInput = document.getElementById("file-input");
    const micBtn = document.getElementById("mic-btn");
    const imageModal = document.getElementById("image-modal");
    const modalImg = document.getElementById("modal-img");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    const actionSheetOverlay = document.getElementById("action-sheet-overlay");
    const actionSheetButtons = document.getElementById("action-sheet-buttons");
    const actionSheetCancel = document.getElementById("action-sheet-cancel");

    const editModalOverlay = document.getElementById("edit-modal-overlay");
    const editMessageInput = document.getElementById("edit-message-input");
    const editCancelBtn = document.getElementById("edit-cancel-btn");
    const editSaveBtn = document.getElementById("edit-save-btn");

    const callScreen = document.getElementById("call-screen");
    const callUserTitle = document.getElementById("call-user-title");
    const callStatusLabel = document.getElementById("call-status-label");
    const acceptCallBtn = document.getElementById("accept-call-btn");
    const hangupCallBtn = document.getElementById("hangup-call-btn");
    const startCallBtn = document.getElementById("start-call-btn");
    const remoteAudio = document.getElementById("remote-audio");

    // Toggle Tabs
    tabLogin.addEventListener("click", () => {
      isRegisterMode = false;
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      authName.classList.add("hidden");
      authDesc.innerText = "Sign in with your Mobile Phone & PIN.";
      authBtn.innerText = "Log In";
    });

    tabRegister.addEventListener("click", () => {
      isRegisterMode = true;
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      authName.classList.remove("hidden");
      authDesc.innerText = "Set up your Phone, Display Name & PIN.";
      authBtn.innerText = "Create Account";
    });

    function cleanPhone(phone) { return phone.replace(/[^0-9]/g, ""); }

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Auto Login Session
    const savedSession = localStorage.getItem("bbchat_user_session");
    if (savedSession) {
      try {
        currentUser = JSON.parse(savedSession);
        authScreen.classList.add("hidden");
        showHomeScreen();
        setupOnlineStatus();
        listenForIncomingCalls();
      } catch (e) {
        localStorage.removeItem("bbchat_user_session");
      }
    }

    // Authenticate Action
    authBtn.addEventListener("click", async () => {
      const rawPhone = authPhone.value.trim();
      const phoneKey = cleanPhone(rawPhone);
      const pin = authPin.value.trim();

      if (!phoneKey || phoneKey.length < 7) { alert("Enter a valid mobile phone number."); return; }
      if (!pin || pin.length < 4) { alert("Enter a valid PIN (minimum 4 digits)."); return; }

      const userRef = dbRef(db, `users/${phoneKey}`);
      const dbSnap = await get(userRef);

      if (isRegisterMode) {
        const name = authName.value.trim();
        if (!name) { alert("Enter your display name."); return; }
        if (dbSnap.exists()) { alert("Account exists. Tap 'Log In'."); return; }

        const userData = { phone: phoneKey, name: name, pin: pin };
        await set(userRef, userData);
        
        currentUser = { uid: phoneKey, phone: phoneKey, name: name };
        localStorage.setItem("bbchat_user_session", JSON.stringify(currentUser));
        
        authScreen.classList.add("hidden");
        showHomeScreen();
        setupOnlineStatus();
        listenForIncomingCalls();
      } else {
        if (!dbSnap.exists()) { alert("Account not found. Switch to 'Create Account'."); return; }

        const val = dbSnap.val();
        if (val && val.pin === pin) {
          currentUser = { uid: phoneKey, phone: phoneKey, name: val.name };
          localStorage.setItem("bbchat_user_session", JSON.stringify(currentUser));
          authScreen.classList.add("hidden");
          showHomeScreen();
          setupOnlineStatus();
          listenForIncomingCalls();
        } else {
          alert("Incorrect PIN.");
        }
      }
    });

    document.getElementById("home-logout-btn").addEventListener("click", () => {
      localStorage.removeItem("bbchat_user_session");
      location.reload();
    });

    document.getElementById("back-to-home-btn").addEventListener("click", () => {
      showHomeScreen();
    });

    // 3D Members Dashboard Generator
    async function showHomeScreen() {
      homeScreen.classList.remove("hidden");
      membersList.innerHTML = "";

      const usersSnap = await get(dbRef(db, "users"));
      if (usersSnap.exists()) {
        usersSnap.forEach((childSnap) => {
          const u = childSnap.val();
          if (u.phone === currentUser.phone) return; // Skip self

          const card = document.createElement("div");
          card.className = "member-card";
          card.innerHTML = `
            <div class="member-card-info">
              <div class="member-avatar">${u.name ? u.name.charAt(0).toUpperCase() : "M"}</div>
              <div class="member-details">
                <div class="member-name">${u.name || "Member"}</div>
                <div class="member-phone">+${u.phone}</div>
              </div>
            </div>
            <div class="chat-now-badge">Chat</div>
          `;

          card.addEventListener("click", () => {
            selectedMember = u;
            document.getElementById("header-name").innerText = u.name;
            homeScreen.classList.add("hidden");
            listenForMessages();
          });

          membersList.appendChild(card);
        });
      }

      if (membersList.children.length === 0) {
        membersList.innerHTML = `<div style="text-align:center; color:#8e8e93; margin-top:40px;">No other members registered yet.<br>Share your link with her!</div>`;
      }
    }

    // Real-time Connection Monitor
    function setupOnlineStatus() {
      const connectedRef = dbRef(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          statusDot.classList.add("online");
          statusText.innerText = "Online";
        } else {
          statusDot.classList.remove("online");
          statusText.innerText = "Offline";
        }
      });
    }

    // Send Text Message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== "" && currentUser) {
        push(dbRef(db, "messages"), { 
          uid: currentUser.uid, 
          sender: currentUser.name, 
          text: text, 
          image: null,
          audio: null,
          timestamp: Date.now(),
          edited: false,
          deletedForEveryone: false
        });
        messageInput.value = "";
      }
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    // Send Image via ImgBB
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;

      const formData = new FormData();
      formData.append("image", file);

      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const result = await res.json();

        if (result.success && result.data && result.data.url) {
          push(dbRef(db, "messages"), {
            uid: currentUser.uid,
            sender: currentUser.name,
            text: "",
            image: result.data.url,
            audio: null,
            timestamp: Date.now(),
            edited: false,
            deletedForEveryone: false
          });
        } else {
          alert("Image upload failed.");
        }
      } catch (err) {
        alert("Upload error: " + err.message);
      }
      fileInput.value = "";
    });

    // FIXED Voice Note Logic (iOS Safari Compatible)
    micBtn.addEventListener("click", async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          // Select supported MIME type for iOS / Safari
          let options = {};
          if (MediaRecorder.isTypeSupported('audio/mp4')) {
            options = { mimeType: 'audio/mp4' };
          } else if (MediaRecorder.isTypeSupported('audio/aac')) {
            options = { mimeType: 'audio/aac' };
          }

          mediaRecorder = new MediaRecorder(stream, options);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            const mimeType = mediaRecorder.mimeType || 'audio/mp4';
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64Audio = reader.result;
              push(dbRef(db, "messages"), {
                uid: currentUser.uid,
                sender: currentUser.name,
                text: "",
                image: null,
                audio: base64Audio,
                timestamp: Date.now(),
                edited: false,
                deletedForEveryone: false
              });
            };
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add("recording");
        } catch (err) {
          alert("Microphone permission required for voice notes: " + err.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove("recording");
      }
    });

    imageModal.addEventListener("click", () => imageModal.classList.add("hidden"));

    // Render Message Element
    function renderMessageHTML(msgId, data) {
      const isMe = currentUser && data.uid === currentUser.uid;
      
      if (data.deletedFor && data.deletedFor[currentUser.uid]) {
        return null;
      }

      const msgDiv = document.createElement("div");
      
      if (data.deletedForEveryone) {
        msgDiv.className = `msg ${isMe ? "sent" : "received"} msg-deleted`;
        msgDiv.id = `msg-${msgId}`;
        msgDiv.innerHTML = `
          <div class="msg-author">${data.sender}</div>
          <div>This message was deleted</div>
          <div class="msg-footer"><span>${formatTime(data.timestamp)}</span></div>
        `;
        return msgDiv;
      }

      msgDiv.className = `msg ${isMe ? "sent" : "received"}`;
      msgDiv.id = `msg-${msgId}`;
      
      let content = `<div class="msg-author">${data.sender}</div>`;
      if (data.text) content += `<div>${data.text}</div>`;
      if (data.image) content += `<img src="${data.image}" alt="photo" class="chat-img" />`;
      if (data.audio) content += `<audio controls playsinline src="${data.audio}"></audio>`;
      
      content += `
        <div class="msg-footer">
          ${data.edited ? '<span class="edited-tag">edited</span> • ' : ''}
          <span>${formatTime(data.timestamp)}</span>
        </div>
      `;
      
      msgDiv.innerHTML = content;

      const imgEl = msgDiv.querySelector(".chat-img");
      if (imgEl) {
        imgEl.addEventListener("click", (e) => {
          e.stopPropagation();
          modalImg.src = data.image;
          imageModal.classList.remove("hidden");
        });
      }

      msgDiv.addEventListener("click", () => openActionSheet(msgId, data));

      return msgDiv;
    }

    // Action Sheet Options
    function openActionSheet(msgId, data) {
      if (data.deletedForEveryone) return;

      activeSelectedMsg = { id: msgId, ...data };
      actionSheetButtons.innerHTML = "";

      const isMe = currentUser && data.uid === currentUser.uid;
      const isWithinOneMin = (Date.now() - data.timestamp) <= 60000;

      if (isMe && isWithinOneMin && data.text && !data.image && !data.audio) {
        const editBtn = document.createElement("button");
        editBtn.className = "action-btn";
        editBtn.innerText = "Edit Message";
        editBtn.addEventListener("click", () => {
          closeActionSheet();
          editMessageInput.value = data.text;
          editModalOverlay.classList.remove("hidden");
        });
        actionSheetButtons.appendChild(editBtn);
      }

      if (isMe && isWithinOneMin) {
        const delEveryoneBtn = document.createElement("button");
        delEveryoneBtn.className = "action-btn danger";
        delEveryoneBtn.innerText = "Delete for Everyone";
        delEveryoneBtn.addEventListener("click", async () => {
          closeActionSheet();
          await update(dbRef(db, `messages/${msgId}`), {
            deletedForEveryone: true,
            text: "", image: null, audio: null
          });
        });
        actionSheetButtons.appendChild(delEveryoneBtn);
      }

      const delMeBtn = document.createElement("button");
      delMeBtn.className = "action-btn danger";
      delMeBtn.innerText = "Delete for Me";
      delMeBtn.addEventListener("click", async () => {
        closeActionSheet();
        await update(dbRef(db, `messages/${msgId}/deletedFor`), {
          [currentUser.uid]: true
        });
        const el = document.getElementById(`msg-${msgId}`);
        if (el) el.remove();
      });
      actionSheetButtons.appendChild(delMeBtn);

      actionSheetOverlay.classList.remove("hidden");
    }

    function closeActionSheet() { actionSheetOverlay.classList.add("hidden"); }

    actionSheetCancel.addEventListener("click", closeActionSheet);
    actionSheetOverlay.addEventListener("click", (e) => {
      if (e.target === actionSheetOverlay) closeActionSheet();
    });

    editSaveBtn.addEventListener("click", async () => {
      if (!activeSelectedMsg) return;
      const isWithinOneMin = (Date.now() - activeSelectedMsg.timestamp) <= 60000;
      if (!isWithinOneMin) {
        alert("Time limit expired! You can only edit messages within 1 minute.");
        editModalOverlay.classList.add("hidden");
        return;
      }

      const newText = editMessageInput.value.trim();
      if (newText && newText !== activeSelectedMsg.text) {
        await update(dbRef(db, `messages/${activeSelectedMsg.id}`), {
          text: newText,
          edited: true
        });
      }
      editModalOverlay.classList.add("hidden");
    });

    editCancelBtn.addEventListener("click", () => editModalOverlay.classList.add("hidden"));

    // Realtime Message Listener
    function listenForMessages() {
      chatBox.innerHTML = "";
      
      onChildAdded(dbRef(db, "messages"), (snapshot) => {
        const msgId = snapshot.key;
        const data = snapshot.val();
        const msgDiv = renderMessageHTML(msgId, data);
        
        if (msgDiv) {
          chatBox.appendChild(msgDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });

      onChildChanged(dbRef(db, "messages"), (snapshot) => {
        const msgId = snapshot.key;
        const data = snapshot.val();
        const existingDiv = document.getElementById(`msg-${msgId}`);
        const updatedDiv = renderMessageHTML(msgId, data);
        
        if (existingDiv) {
          if (updatedDiv) existingDiv.replaceWith(updatedDiv);
          else existingDiv.remove();
        } else if (updatedDiv) {
          chatBox.appendChild(updatedDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });

      onChildRemoved(dbRef(db, "messages"), (snapshot) => {
        const msgDiv = document.getElementById(`msg-${snapshot.key}`);
        if (msgDiv) msgDiv.remove();
      });
    }

    // WebRTC Realtime Voice Calling Logic
    startCallBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        peerConnection = new RTCPeerConnection(rtcServers);

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          remoteAudio.srcObject = event.streams[0];
        };

        const callRoomRef = dbRef(db, "active_call");

        const offerCandidatesRef = child(callRoomRef, "callerCandidates");
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) push(offerCandidatesRef, event.candidate.toJSON());
        };

        const offerDescription = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offerDescription);

        await set(callRoomRef, {
          offer: { type: offerDescription.type, sdp: offerDescription.sdp },
          callerName: currentUser.name,
          callerUid: currentUser.uid,
          status: "calling"
        });

        callUserTitle.innerText = "Calling...";
        callStatusLabel.innerText = "Ringing...";
        acceptCallBtn.classList.add("hidden");
        callScreen.classList.remove("hidden");

        onValue(child(callRoomRef, "answer"), (snapshot) => {
          const answer = snapshot.val();
          if (answer && peerConnection && !peerConnection.currentRemoteDescription) {
            peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            callStatusLabel.innerText = "Connected";
          }
        });

        onChildAdded(child(callRoomRef, "calleeCandidates"), (snapshot) => {
          const candidate = new RTCIceCandidate(snapshot.val());
          if (peerConnection) peerConnection.addIceCandidate(candidate);
        });

        onValue(child(callRoomRef, "status"), (snapshot) => {
          if (snapshot.val() === "ended") endCall(false);
        });

      } catch (err) {
        alert("Microphone access failed: " + err.message);
      }
    });

    function listenForIncomingCalls() {
      const callRoomRef = dbRef(db, "active_call");
      onValue(callRoomRef, async (snapshot) => {
        const data = snapshot.val();
        if (data && data.status === "calling" && data.callerUid !== currentUser.uid) {
          callUserTitle.innerText = data.callerName;
          callStatusLabel.innerText = "Incoming Voice Call";
          acceptCallBtn.classList.remove("hidden");
          callScreen.classList.remove("hidden");

          acceptCallBtn.onclick = async () => {
            acceptCallBtn.classList.add("hidden");
            callStatusLabel.innerText = "Connecting...";

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            peerConnection = new RTCPeerConnection(rtcServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
              remoteAudio.srcObject = event.streams[0];
            };

            const calleeCandidatesRef = child(callRoomRef, "calleeCandidates");
            peerConnection.onicecandidate = (event) => {
              if (event.candidate) push(calleeCandidatesRef, event.candidate.toJSON());
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));

            const answerDescription = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answerDescription);

            await update(callRoomRef, {
              answer: { type: answerDescription.type, sdp: answerDescription.sdp },
              status: "connected"
            });

            onChildAdded(child(callRoomRef, "callerCandidates"), (snapshot) => {
              const candidate = new RTCIceCandidate(snapshot.val());
              if (peerConnection) peerConnection.addIceCandidate(candidate);
            });

            callStatusLabel.innerText = "Connected";
          };
        } else if (!data || data.status === "ended") {
          endCall(false);
        }
      });
    }

    hangupCallBtn.addEventListener("click", () => endCall(true));

    async function endCall(notifyPeer = true) {
      if (notifyPeer) {
        await update(dbRef(db, "active_call"), { status: "ended" });
        setTimeout(() => remove(dbRef(db, "active_call")), 1000);
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      callScreen.classList.add("hidden");
    }
  </script>
</body>
</html>
